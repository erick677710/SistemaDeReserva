<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Dependiente</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Panel del Dependiente</h1>

    <p id="info"></p>

    <h2>Agregar producto</h2>

    <input type="text" id="nuevoProducto" placeholder="Nombre del producto">
    <button id="agregarProducto">Agregar</button>

    <h2>Productos</h2>
    <ul id="productos"></ul>

    <h2>Pedidos recibidos</h2>
    <button id="actualizarPedidos">Actualizar</button>

    <ul id="pedidos"></ul>

    <br>

    <button id="logout">Cerrar sesión</button>

    <script src="{{ url_for('static', filename='dependiente.js') }}"></script>
</body>
</html>
