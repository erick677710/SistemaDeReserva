{% extends 'base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<section class="auth card">
    <h1>Iniciar sesión</h1>

    <form id="form-login" method="post">
        <label for="email">Correo</label>
        <input
            id="email"
            type="text"
            name="email"
            placeholder="usuario@correo.com"
            required
        >

        <label for="password">Contraseña</label>
        <input
            id="password"
            type="password"
            name="password"
            required
        >

        <button type="submit">Ingresar</button>
    </form>

    <p>
        ¿No tienes cuenta?
        <a href="{{ url_for('registro') }}">Registrarte como cliente</a>
    </p>

    <div class="demo">
        <strong>Dependiente demo</strong><br>
        dependiente@demo.com<br>
        123456
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/cliente.js') }}"></script>
{% endblock %}
